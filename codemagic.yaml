workflows:
  ryde-ble-unlock:
    name: Ryde BLE Unlock IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      push:
        branch: main
    scripts:
      - name: Setup & Build
        script: |
          mkdir -p RydeUnlock/RydeUnlock
          mv ContentView.swift RydeUnlock/RydeUnlock/ 2>/dev/null || true
          mv RydeUnlockApp.swift RydeUnlock/RydeUnlock/ 2>/dev/null || true
          mv Info.plist RydeUnlock/ 2>/dev/null || true
          
          cd RydeUnlock
          
          # Create Xcode project
          xcodegen generate --spec - << 'EOG'
name: RydeUnlock
options:
  bundleIdPrefix: com.rydeunlock
  deploymentTarget:
    iOS: 15.0
targets:
  RydeUnlock:
    type: application
    platform: iOS
    sources:
      - path: .
    settings:
      INFOPLIST_FILE: Info.plist
    entitlements:
      com.apple.developer.bluetooth-central: true
EOG
          
          xcodebuild -project RydeUnlock.xcodeproj -scheme RydeUnlock -sdk iphoneos -configuration Release archive -archivePath ../build/RydeUnlock.xcarchive CODE_SIGNING_ALLOWED=NO || echo "Build failed"
          xcodebuild -exportArchive -archivePath ../build/RydeUnlock.xcarchive -exportOptionsPlist ../exportOptions.plist -exportPath ../build/output || echo "Export failed"
    artifacts:
      - build/output/*.ipa

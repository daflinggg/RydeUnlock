workflows:
  ryde-unlock:
    name: Ryde BLE Unlock
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      push:
        branch: main
    scripts:
      - name: Build
        script: |
          mkdir -p RydeUnlock/RydeUnlock
          mv *.swift RydeUnlock/RydeUnlock/ 2>/dev/null || true
          mv Info.plist RydeUnlock/ 2>/dev/null || true
          
          cd RydeUnlock
          
          echo '{
            "name": "RydeUnlock",
            "targets": {
              "RydeUnlock": {
                "type": "application",
                "platform": "iOS",
                "sources": [ "." ],
                "settings": {
                  "INFOPLIST_FILE": "Info.plist"
                }
              }
            }
          }' > project.json
          
          xcodebuild -project RydeUnlock.xcodeproj -scheme RydeUnlock -sdk iphoneos CODE_SIGNING_ALLOWED=NO || echo "xcodebuild failed"
    artifacts:
      - '**/*.ipa'
      - build/*.ipa
